<title>VigiLex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : coque d'application (barre latérale bureau / onglets mobile) + vues routées par #hash
   Couleurs : charte Afflatus (bleu foncé #1F3864, bleu moyen #2E75B6, orange #C55A11, vert #E2EFDA, jaune #FFF2CC) */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface2:#edf2f8; --ink:#1b2536; --muted:#5a6578; --line:#d8e0ec; --heading:#1F3864;
  --brand:#1F3864; --brand-ink:#ffffff; --orange:#C55A11; --orange-soft:#fbeadf;
  --accent:#2E75B6; --accent-ink:#ffffff; --accent-soft:#e2edf8;
  --ok:#3b7a2b; --ok-soft:#E2EFDA; --warn:#8a5a00; --warn-soft:#FFF2CC; --bad:#b3261e; --bad-soft:#fbe3e0; --na:#77819a; --na-soft:#eceff4;
  --f-display:"Manrope",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --surface:#151e33; --surface2:#1b263f; --ink:#e2e8f2; --muted:#9ba7bc; --line:#29375a; --heading:#e2e8f2;
  --brand:#0b1428; --brand-ink:#ffffff; --orange:#e8894d; --orange-soft:#3a2416;
  --accent:#6aa8e2; --accent-ink:#0a1830; --accent-soft:#1a2d4c;
  --ok:#8fcf7d; --ok-soft:#1d3220; --warn:#f0c35a; --warn-soft:#3a3014; --bad:#f07a6e; --bad-soft:#3e1d1a; --na:#8d98ad; --na-soft:#222c42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#151e33; --surface2:#1b263f; --ink:#e2e8f2; --muted:#9ba7bc; --line:#29375a; --heading:#e2e8f2;
  --brand:#0b1428; --brand-ink:#ffffff; --orange:#e8894d; --orange-soft:#3a2416;
  --accent:#6aa8e2; --accent-ink:#0a1830; --accent-soft:#1a2d4c;
  --ok:#8fcf7d; --ok-soft:#1d3220; --warn:#f0c35a; --warn-soft:#3a3014; --bad:#f07a6e; --bad-soft:#3e1d1a; --na:#8d98ad; --na-soft:#222c42; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem;color:var(--heading)}h2{font-size:1.15rem}h3{font-size:1rem}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.01em}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--brand);color:var(--brand-ink);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--orange);color:#fff;display:grid;place-items:center;font:800 .8rem var(--f-display)}
.brand b{font-family:var(--f-display);display:block;line-height:1.1}
.logo{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.logo em{font-style:normal;color:var(--orange)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;text-decoration:none;color:rgba(255,255,255,.82);font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--orange)}
.side .muted,.side .label{color:rgba(255,255,255,.62)}
.count{font:600 .72rem var(--f-body);background:var(--orange);color:#fff;border-radius:99px;padding:1px 7px}
.role{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.role select{width:100%;padding:8px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(255,255,255,.08);color:#fff}
.role select option{color:#1b2536;background:#fff}
.role .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
.role .btn:hover{background:rgba(255,255,255,.1)}

.main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.account{display:flex;flex-direction:column;gap:2px}
.demo{border:1px solid var(--orange);background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:.85rem}
.demo b{color:var(--orange)}

.mobilebar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobilebar{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-bottom:3px solid var(--brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .mobilebar .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .mobilebar select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);max-width:150px}
  .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
  .tabs a{white-space:nowrap;padding:8px 10px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
  .tabs a.on{color:var(--heading);font-weight:600;border-bottom-color:var(--orange)}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .v{font:800 1.9rem/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .s{font-size:.82rem;color:var(--muted)}
.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:860px){.two{grid-template-columns:1fr}}

.bar{display:grid;grid-template-columns:118px 1fr 46px;gap:10px;align-items:center;font-size:.9rem}
.track{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-na{background:var(--na-soft);color:var(--na)}
.p-info{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.date{font-variant-numeric:tabular-nums;font-weight:600;font-size:.86rem}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.88rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:#fff;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--brand)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td select{padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
td.mono,td>.mono{white-space:nowrap}
td input{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn.bad{color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.texte{display:flex;flex-direction:column;gap:12px}
.texte-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.req{display:grid;grid-template-columns:86px 1fr auto;gap:12px;padding:10px 12px;border-radius:9px;background:var(--surface2);align-items:start}
.req p{margin:2px 0 0;font-size:.84rem;color:var(--muted)}
.why{font-size:.82rem;color:var(--accent);margin-top:3px}
@media (max-width:600px){.req,.li{grid-template-columns:1fr}.req .pill,.li .pill{justify-self:start}}

form.onb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){form.onb{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;display:flex;flex-direction:column;gap:9px;background:var(--surface);min-width:0}
legend{font:700 .95rem var(--f-display);padding:0 6px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:.9rem}
.chk input{margin-top:4px;accent-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.fld input,.fld select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);width:100%}
.result{position:sticky;bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--brand);color:#fff;border-radius:12px;padding:12px 16px}
.result b{font:800 1.3rem var(--f-display)}
.result .btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}

.notif{display:flex;flex-direction:column;gap:12px;border-left:4px solid var(--accent)}
.notif.unread{border-left-color:var(--orange)}
.notif .ch{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem;background:var(--surface2);padding:10px 12px;border-radius:9px}
.notif ul{margin:0;padding-left:18px;font-size:.9rem}
.diff del{color:var(--bad);text-decoration:line-through}
.diff ins{color:var(--ok);text-decoration:none;font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.tl .li{grid-template-columns:132px 1fr}
@media (max-width:600px){.tl .li{grid-template-columns:1fr}}
.veilles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.veilles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.veilles a{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:10px;background:var(--surface2);text-decoration:none;color:var(--ink);border-top:3px solid var(--accent)}
.veilles a:nth-child(2){border-top-color:var(--brand)} .veilles a:nth-child(3){border-top-color:var(--orange)} .veilles a:nth-child(4){border-top-color:var(--ok)}
.veilles a:hover{filter:brightness(.97)}
.veilles b{font:800 1.4rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.veilles span{font-size:.8rem;color:var(--muted)}
.note{font-size:.84rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:0}
.src{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.src:first-child{border-top:0}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .4s ease}}
</style>

    <nav class="nav" id="nav"></nav>
    <div class="role">

  </aside>
  <div style="min-width:0">
    <div class="mobilebar">
      <div class="row"><div class="brand"><div class="brand-mark">VL</div><b class="logo">Vigi<em>Lex</em></b></div>
        <select id="role-m" aria-label="Rôle"><option value="client">Client</option><option value="expert">Expert</option><option value="admin">Admin</option></select></div>
      <nav class="tabs" id="tabs"></nav>
    </div>
    <main class="main"><div class="wrap" id="view"></div></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

const STAT={conforme:["Conforme","p-ok"],partiel:["Partiel","p-warn"],nc:["Non conforme","p-bad"],na:["N/A","p-na"],"":["Non évalué","p-na"]};
const pill=s=>`<span class="pill ${STAT[s||""][1]}">${STAT[s||""][0]}</span>`;
const today=new Date();today.setHours(0,0,0,0);
function fmt(iso){if(!/^\d{4}/.test(iso))return iso==="projet"?"À chaque projet":"Permanent";const[y,m,d]=iso.split("-");return`${d}/${m}/${y}`}
function echPill(iso){if(!/^\d{4}/.test(iso))return`<span class="pill p-info">${fmt(iso)}</span>`;
  const d=new Date(iso),j=Math.round((d-today)/864e5);
  if(j<=0)return`<span class="pill p-ok">Applicable</span>`;
  const mois=Math.round(j/30.4);return`<span class="pill ${j<365?"p-warn":"p-info"}">Dans ${mois<1?j+" j":mois+" mois"}</span>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function stats(){
  const ap=applicables(),ev=ap.filter(e=>S.eval[e.id]?.s),
    eff=ev.filter(e=>S.eval[e.id].s!=="na"),conf=eff.filter(e=>S.eval[e.id].s==="conforme").length,
    part=eff.filter(e=>S.eval[e.id].s==="partiel").length;
  const textes=[...new Set(ap.map(e=>e.t))];
  const ouvertes=S.actions.filter(a=>a.st!=="Terminée"),retard=ouvertes.filter(a=>new Date(a.ech)<today);
  return{ap,ev,eff,conf,part,textes,ouvertes,retard,taux:eff.length?Math.round((conf+part*.5)/eff.length*100):0};
}

    const tot=ex.length||1;
    return`<div class="bar"><span>${DOM[d]}</span><div class="track" title="${c} conformes, ${pa} partielles, ${n} non conformes, ${ex.length-ev.length} non évaluées">

      <span class="pct">${ex.length?ev.length+"/"+ex.length:"–"}</span></div>`}).join("");
  const proch=st.ap.filter(e=>/^\d/.test(e.ech)).sort((a,b)=>a.ech.localeCompare(b.ech)).slice(0,6);
  const nonLu=S.notifs.filter(n=>!n.lu);
  return`<div class="grid kpis">
    <div class="card kpi"><span class="label">Textes applicables</span><div class="v">${st.textes.length}</div><div class="s">${st.ap.length} exigences</div></div>
    <div class="card kpi"><span class="label">Exigences évaluées</span><div class="v">${st.ev.length}<span class="muted" style="font-size:1rem">/${st.ap.length}</span></div><div class="s">${st.ap.length-st.ev.length} à évaluer</div></div>
    <div class="card kpi"><span class="label">Taux de conformité</span><div class="v" style="color:${st.taux>=80?"var(--ok)":st.taux>=50?"var(--warn)":"var(--bad)"}">${st.taux} %</div><div class="s">partiel compté à 50 %</div></div>
    <div class="card kpi"><span class="label">Actions ouvertes</span><div class="v">${st.ouvertes.length}</div><div class="s" style="color:${st.retard.length?"var(--bad)":"var(--muted)"}">${st.retard.length} en retard</div></div>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><h2>Vos 4 veilles</h2><div class="veilles">
    <a href="#registre"><span class="label">Réglementaire</span><b>${st.textes.length}</b><span>textes · ${st.ap.length} exigences</span></a>
    <a href="#normes"><span class="label">Normative</span><b>${S.profil.normes.length}</b><span>normes et référentiels suivis</span></a>
    <a href="#science"><span class="label">Scientifique</span><b>${biblioDe("sci").length}</b><span>avis, rapports et alertes</span></a>
    <a href="#science"><span class="label">Guides</span><b>${biblioDe("guide").length}</b><span>guides et codes d'usages</span></a>
  </div></div>
  ${nonLu.length?`<a href="#alertes" class="card" style="text-decoration:none;color:inherit;border-color:var(--accent);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><span><b>${nonLu.length} nouvelle${nonLu.length>1?"s":""} mise${nonLu.length>1?"s":""} à jour réglementaire${nonLu.length>1?"s":""}</b> <span class="muted">· ${esc(nonLu[0].titre)}</span></span><span class="btn sm pri">Voir</span></a>`:""}
  <div class="grid two">
    <div class="card" style="display:flex;flex-direction:column;gap:12px"><h2>Conformité par domaine</h2>${parDom||'<p class="muted">Aucun domaine sélectionné.</p>'}
      <div class="meta"><span><span class="pill p-ok">Conforme</span></span><span><span class="pill p-warn">Partiel</span></span><span><span class="pill p-bad">Non conforme</span></span><span>Gris : non évalué</span></div></div>
    <div class="card"><h2>Échéances réglementaires</h2><div class="list" style="margin-top:6px">
      ${proch.map(e=>`<div class="li"><span class="date">${fmt(e.ech)}</span><span><span class="mono muted">${TEXTES[e.t].ref} · ${e.art}</span><br>${esc(e.lib)}</span>${echPill(e.ech)}</div>`).join("")||'<div class="empty">Aucune échéance datée.</div>'}
    </div></div>
  </div>`;
};
function adminDash(){

    <label class="fld">Activité<input id="f-activite" value="${esc(p.activite)}"></label>

  </form>

const bind={};
bind.perimetre=()=>{const f=document.getElementById("onb");
  f.addEventListener("input",e=>{const el=e.target,p=S.profil;
    if(el.dataset.b)p[el.dataset.b]=el.checked;
    else if(el.dataset.dom){p.dom=el.checked?[...new Set([...p.dom,el.dataset.dom])]:p.dom.filter(x=>x!==el.dataset.dom)}
    else if(el.dataset.jur){p.jur=el.checked?[...new Set([...p.jur,el.dataset.jur])]:p.jur.filter(x=>x!==el.dataset.jur)}
    else if(el.dataset.norme){p.normes=el.checked?[...new Set([...p.normes,el.dataset.norme])]:p.normes.filter(x=>x!==el.dataset.norme)}
    else if(el.dataset.prod){p.produits=el.checked?[...new Set([...p.produits,el.dataset.prod])]:p.produits.filter(x=>x!==el.dataset.prod)}
    else if(el.id.startsWith("f-")){const k=el.id.slice(2);p[k]=k==="effectif"?(parseInt(el.value)||0):el.value}
    save();const ap=applicables();document.getElementById("nb").textContent=ap.length;document.getElementById("nbt").textContent=new Set(ap.map(x=>x.t)).size;document.getElementById("nbn").textContent=p.normes.length;document.getElementById("nbp").textContent=p.produits.length;
    document.querySelectorAll(".top .btns").forEach(b=>b.innerHTML=p.jur.map(j=>`<span class="tag">${JUR[j]}</span>`).join(""));
  });
  f.addEventListener("submit",e=>e.preventDefault());
};

VIEWS.registre=()=>{const ap=applicables();const ids=[...new Set(ap.map(e=>e.t))];
  if(!ids.length)return`<div class="card empty">Aucun texte applicable. Élargissez le périmètre.</div>`;
  return ids.map(t=>{const T=TEXTES[t],ex=ap.filter(e=>e.t===t),ev=ex.filter(e=>S.eval[e.id]?.s&&S.eval[e.id].s!=="na"),
    c=ev.filter(e=>S.eval[e.id].s==="conforme").length;
    return`<section class="card texte"><div class="texte-head"><div><span class="mono muted">${T.ref}</span><h2>${T.titre}</h2></div>
      <div class="btns"><span class="tag">${JUR[T.jur]}</span><span class="tag">${DOM[T.dom]}</span><span class="pill p-ok">${T.statut}</span></div></div>
      <div class="meta"><span>${T.dates}</span><a href="${T.source}" target="_blank" rel="noopener">Source officielle : ${T.sourceNom} ↗</a></div>
      <p style="margin:0">${T.resume}</p>
      <div class="label">${ex.length} exigence${ex.length>1?"s":""} applicable${ex.length>1?"s":""} à votre site · ${c}/${ev.length} conformes</div>
      ${ex.map(e=>`<div class="req"><span class="mono">${e.art}</span><div><b>${esc(e.lib)}</b><p>Preuve attendue : ${esc(e.preuve)}</p><div class="why">Pourquoi vous : ${esc(whyOf(e))}</div></div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">${pill(S.eval[e.id]?.s)}${echPill(e.ech)}</div></div>`).join("")}
    </section>`}).join("");
};

VIEWS.diagnostic=()=>{const ap=applicables();const st=stats();
  return`<div class="card" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><span><b>${st.ev.length}/${ap.length}</b> exigences évaluées. Un statut « Partiel » ou « Non conforme » propose automatiquement une action.</span><a class="btn" href="#plan">Voir le plan d'action</a></div>
  <div class="tbl"><table><thead><tr><th>N°</th><th>Texte · article</th><th>Exigence</th><th>Statut</th><th>Constat</th><th>Échéance</th></tr></thead><tbody>
  ${ap.map(e=>{const v=S.eval[e.id]||{};return`<tr><td class="mono">${e.id}</td><td><span class="mono">${TEXTES[e.t].ref}</span><br><span class="muted">${e.art}</span></td>
   <td>${esc(e.lib)}<br><span class="muted" style="font-size:.8rem">Preuve : ${esc(e.preuve)}</span></td>
   <td><select data-ev="${e.id}" aria-label="Statut ${e.id}">${Object.entries(STAT).map(([k,[l]])=>`<option value="${k}" ${(v.s||"")===k?"selected":""}>${l}</option>`).join("")}</select></td>
   <td><input data-c="${e.id}" value="${esc(v.c||"")}" placeholder="Constat, preuve…" aria-label="Constat ${e.id}"></td><td>${echPill(e.ech)}</td></tr>`}).join("")}
  </tbody></table></div>`;
};
bind.diagnostic=()=>{document.querySelectorAll("[data-ev]").forEach(s=>s.addEventListener("change",()=>{
  const id=s.dataset.ev;S.eval[id]={...(S.eval[id]||{}),s:s.value};
  if((s.value==="nc"||s.value==="partiel")&&!S.actions.find(a=>a.ex===id&&a.st!=="Terminée")){
    const e=exigById(id),n=S.actions.length+1;
    S.actions.push({id:"A-"+String(n).padStart(2,"0"),ex:id,txt:e.action,resp:"À définir",ech:/^\d/.test(e.ech)&&new Date(e.ech)>today?e.ech:new Date(today.getTime()+90*864e5).toISOString().slice(0,10),st:"Proposée",val:false});
    toast("Action proposée ajoutée au plan, en attente de validation par l'expert");
  }save();route();}));
 document.querySelectorAll("[data-c]").forEach(i=>i.addEventListener("change",()=>{const id=i.dataset.c;S.eval[id]={...(S.eval[id]||{}),c:i.value};save()}));
};

VIEWS.plan=()=>{const ex=S.role==="expert";
  if(!S.actions.length)return`<div class="card empty">Aucune action. Évaluez les exigences dans le diagnostic.</div>`;
  const att=S.actions.filter(a=>!a.val).length;
  return`<div class="card" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
   <span>${S.actions.length} actions · <b style="color:${att?"var(--warn)":"var(--ok)"}">${att} en attente de validation expert</b></span>
   ${ex?'<span class="muted">Vous êtes l\'expert : validez, ajustez ou rejetez chaque action proposée.</span>':'<span class="muted">Passez en rôle « Expert » pour valider les actions.</span>'}</div>
  <div class="tbl"><table><thead><tr><th>N°</th><th>Écart lié</th><th>Action</th><th>Responsable</th><th>Échéance</th><th>Statut</th><th>Validation</th></tr></thead><tbody>
  ${S.actions.map((a,i)=>{const e=exigById(a.ex),late=a.st!=="Terminée"&&new Date(a.ech)<today;
   return`<tr><td class="mono">${a.id}</td><td><span class="mono">${a.ex}</span><br><span class="muted" style="font-size:.8rem">${e?TEXTES[e.t].ref:""}</span></td>
   <td>${esc(a.txt)}</td><td>${ex?`<input data-resp="${i}" value="${esc(a.resp)}" aria-label="Responsable ${a.id}">`:esc(a.resp)}</td>
   <td><span class="date" style="color:${late?"var(--bad)":"inherit"}">${fmt(a.ech)}</span>${late?'<br><span class="pill p-bad">En retard</span>':""}</td>
   <td><select data-st="${i}" aria-label="Statut ${a.id}">${["Proposée","À faire","En cours","Terminée"].map(s=>`<option ${a.st===s?"selected":""}>${s}</option>`).join("")}</select></td>
   <td>${a.val?'<span class="pill p-ok">Validée</span>':ex?`<div class="btns"><button class="btn sm pri" data-val="${i}" type="button">Valider</button><button class="btn sm bad" data-rej="${i}" type="button">Rejeter</button></div>`:'<span class="pill p-warn">En attente</span>'}</td></tr>`}).join("")}
  </tbody></table></div>`;
};
bind.plan=()=>{
  document.querySelectorAll("[data-val]").forEach(b=>b.addEventListener("click",()=>{const a=S.actions[b.dataset.val];a.val=true;if(a.st==="Proposée")a.st="À faire";save();toast(`${a.id} validée`);route()}));
  document.querySelectorAll("[data-rej]").forEach(b=>b.addEventListener("click",()=>{const a=S.actions.splice(b.dataset.rej,1)[0];save();toast(`${a.id} rejetée`);route()}));
  document.querySelectorAll("[data-st]").forEach(s=>s.addEventListener("change",()=>{S.actions[s.dataset.st].st=s.value;save();route()}));
  document.querySelectorAll("[data-resp]").forEach(s=>s.addEventListener("change",()=>{S.actions[s.dataset.resp].resp=s.value;save()}));
};

function notifHead(n){
  if(n.kind)return{ref:n.ref,dom:n.domLabel,src:n.srcNom,url:n.srcUrl,veille:n.kind==="norme"?"Veille normative":"Veille scientifique"};
  const T=TEXTES[n.t];return{ref:T.ref,dom:`${DOM[T.dom]} · ${JUR[T.jur]}`,src:T.sourceNom,url:T.source,veille:"Veille réglementaire"}}
VIEWS.alertes=()=>{if(!S.notifs.length)return`<div class="card empty">Aucune notification.</div>`;
  return S.notifs.map(n=>{const H=notifHead(n);
   const imp=n.kind?n.impacts.map(x=>`<li>${esc(x)}</li>`).join(""):n.exig.map(id=>{const e=exigById(id);return e?`<li><span class="mono">${id}</span> ${esc(e.lib)}</li>`:""}).join("");
   const acts=n.actions.map(id=>{const a=S.actions.find(x=>x.id===id);return a?`<li><span class="mono">${a.id}</span> ${esc(a.txt)} – échéance ${fmt(a.ech)} ${a.val?'<span class="pill p-ok">Validée</span>':'<span class="pill p-warn">À valider par l\'expert</span>'}</li>`:""}).join("");
   return`<article class="card notif ${n.lu?"":"unread"}">
   <div class="texte-head"><div><span class="label">${n.date} · ${H.veille} · ${n.type}${n.fictif?' · <span style="color:var(--orange)">exemple fictif</span>':""}</span><h2>${esc(n.titre)}</h2></div>${n.lu?"":'<span class="pill p-info">Nouveau</span>'}</div>
   <div class="ch"><span class="muted">Référence</span><span class="mono">${esc(H.ref)}</span><span class="muted">Domaine</span><span>${esc(H.dom)}</span><span class="muted">Source</span><a href="${H.url}" target="_blank" rel="noopener">${esc(H.src)} ↗</a></div>
   <div><div class="label">Ce qui change</div><div class="diff">${n.change}</div></div>
   <div><div class="label">Pourquoi vous êtes concerné</div>${esc(n.pourquoi)}</div>
   <div><div class="label">${n.kind?"Éléments impactés":"Exigences impactées"}</div><ul>${imp}</ul></div>
   <div><div class="label">Plan d'action proposé</div>${acts?`<ul>${acts}</ul>`:'<span class="muted">Aucune action requise.</span>'}</div>
   <div class="btns">${n.lu?"":`<button class="btn sm" data-lu="${n.id}" type="button">Marquer comme lu</button>`}<a class="btn sm pri" href="#plan">Ouvrir le plan d'action</a>${n.kind==="science"?'<a class="btn sm" href="#haccp">Ouvrir la base HACCP</a>':""}${n.kind==="norme"?'<a class="btn sm" href="#normes">Ouvrir les normes</a>':""}</div>
  </article>`}).join("");
};
bind.alertes=()=>document.querySelectorAll("[data-lu]").forEach(b=>b.addEventListener("click",()=>{S.notifs.find(n=>n.id===b.dataset.lu).lu=true;save();route()}));

const comptes=()=>[{nom:S.profil.societe,p:S.profil,moi:true}].concat(AUTRES_COMPTES);
function impact(m){return comptes().filter(c=>{
  if(m.kind==="norme")return(c.p.normes||[]).includes(m.norme);
  if(m.kind==="science")return(c.p.produits||[]).includes(m.produit);
  const e=m.nouv||exigById(m.exig);return enPerimetre(e,c.p)&&e.ok(c.p)})}
function majHead(m){
  if(m.kind==="norme"){const N=NORMES[m.norme];return{ref:N.ref,dom:`${DOM[N.dom]} · ${N.org}`,veille:"Veille normative",court:N.ref}}
  if(m.kind==="science"){const d=DANGERS[m.produit].find(x=>x.id===m.danger);return{ref:"Base HACCP · "+d.nom,dom:PRODUITS[m.produit].nom,veille:"Veille scientifique",court:"HACCP · "+d.nom}}
  const T=TEXTES[m.t];return{ref:T.ref,dom:`${DOM[T.dom]} · ${JUR[T.jur]}`,veille:"Veille réglementaire",court:m.exig}}
VIEWS.validation=()=>{const att=MAJ_DETECTEES.filter(m=>!S.majFaites.includes(m.id));
  const done=MAJ_DETECTEES.filter(m=>S.majFaites.includes(m.id));
  return`<p class="muted" style="margin:0">Les collecteurs surveillent les sources officielles des 4 veilles. Rien n'entre dans la base ni n'est envoyé aux clients sans votre validation.</p>
  ${att.length?att.map(m=>{const H=majHead(m),imp=impact(m);
   const pre=m.kind?`<div class="req"><span class="mono">${m.kind==="norme"?"Norme":"Danger"}</span><div><b>${esc(m.resume)}</b><p>${esc(m.detail)}</p></div><span></span></div>`:
     m.nouv?`<div class="req"><span class="mono">${m.nouv.id}</span><div><b>${esc(m.nouv.lib)}</b><p>Preuve : ${esc(m.nouv.preuve)}</p></div>${echPill(m.nouv.ech)}</div>`:
     `<div class="diff req"><span class="mono">${m.exig}</span><div><del>${esc(m.avant)}</del><br><ins>${esc(m.apres)}</ins></div><span></span></div>`;
   return`<article class="card texte">
   <div class="texte-head"><div><span class="label">${H.veille} · détecté le ${m.detecte} · ${m.src}${m.fictif?' · <span style="color:var(--orange)">exemple fictif</span>':""}</span><h2>${esc(m.titre)}</h2></div><span class="pill p-warn">${m.type}</span></div>
   <div class="meta"><span class="mono">${esc(H.ref)}</span><span>${esc(H.dom)}</span></div>
   <div><div class="label">Pré-analyse IA</div>${pre}</div>
   <div><div class="label">Actions proposées aux clients</div><ul style="margin:4px 0 0;padding-left:18px">${m.actions.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>
   <div><div class="label">Analyse d'impact : ${imp.length} compte${imp.length>1?"s":""} concerné${imp.length>1?"s":""}</div><div class="btns" style="margin-top:4px">${imp.map(c=>`<span class="tag">${esc(c.nom)}</span>`).join("")||'<span class="muted">Aucun</span>'}</div></div>
   <div class="btns"><button class="btn pri" data-pub="${m.id}" type="button">Valider, publier et notifier</button><button class="btn bad" data-ign="${m.id}" type="button">Rejeter</button></div>
  </article>`}).join(""):`<div class="card empty">Aucune mise à jour en attente.</div>`}
  ${done.length?`<div class="card"><h2>Historique</h2><div class="list" style="margin-top:6px">${done.map(m=>`<div class="li"><span class="date">${m.detecte}</span><span>${esc(m.titre)}</span><span class="pill p-ok">Traitée</span></div>`).join("")}</div></div>`:""}`;
};
bind.validation=()=>{
  document.querySelectorAll("[data-pub]").forEach(b=>b.addEventListener("click",()=>{const m=MAJ_DETECTEES.find(x=>x.id===b.dataset.pub),H=majHead(m);
    const imp=impact(m),moi=imp.find(c=>c.moi);
    S.majFaites.push(m.id);
    if(m.nouv)S.extra.push(m.exig);
    if(m.kind==="norme")S.normeMaj.push(m.id);
    if(m.kind==="science"&&moi)S.haccpRevoir.push(m.danger);
    if(moi){const ids=[],e=m.kind?null:(m.nouv||exigById(m.exig));
      const ech=m.ech||(/^\d/.test(e.ech)?e.ech:new Date(today.getTime()+90*864e5).toISOString().slice(0,10));
      m.actions.forEach(txt=>{const id="A-"+String(S.actions.length+1).padStart(2,"0");
        S.actions.push({id,ex:H.court,txt,resp:"À définir",ech,st:"Proposée",val:false});ids.push(id)});
      const base={id:"N-"+m.id,lu:false,date:new Date().toLocaleDateString("fr-FR"),titre:m.titre,type:m.type,fictif:m.fictif,actions:ids};
      S.notifs.unshift(m.kind?{...base,kind:m.kind,ref:H.ref,domLabel:H.dom,srcNom:m.src,srcUrl:m.url,change:esc(m.resume)+" "+esc(m.detail),pourquoi:m.pourquoi,impacts:m.impacts}:
        {...base,t:m.t,change:m.nouv?`<ins>Nouvelle exigence : ${esc(m.nouv.lib)}</ins>`:`Avant : <del>${esc(m.avant)}</del><br>Maintenant : <ins>${esc(m.apres)}</ins>`,pourquoi:whyOf(e),exig:[m.exig]});}
    save();toast(`Publiée · ${imp.length} compte${imp.length>1?"s":""} notifié${imp.length>1?"s":""}`);route();}));
  document.querySelectorAll("[data-ign]").forEach(b=>b.addEventListener("click",()=>{S.majFaites.push(b.dataset.ign);save();toast("Mise à jour rejetée");route()}));
};

/* ============ VEILLE NORMATIVE ============ */
VIEWS.normes=()=>{const sel=S.profil.normes,autres=Object.keys(NORMES).filter(k=>!sel.includes(k));
  const carte=k=>{const N=NORMES[k];
    const hist=N.hist.concat(MAJ_DETECTEES.filter(m=>m.kind==="norme"&&m.norme===k&&S.normeMaj.includes(m.id)).map(m=>[m.detecte,m.titre+" (exemple fictif)"]));
    return`<section class="card texte"><div class="texte-head"><div><span class="mono muted">${N.org}</span><h2>${N.ref}</h2><span class="muted">${N.titre}</span></div>
     <div class="btns"><span class="tag">${DOM[N.dom]}</span><span class="pill ${N.pill}">${N.statut}</span></div></div>
     <div class="label">Historique et amendements</div>
     <div class="list tl">${hist.map(h=>`<div class="li"><span class="date">${h[0]}</span><span>${esc(h[1])}</span></div>`).join("")}</div>
     <div><div class="label">Ce que cela implique pour vous</div>${esc(N.ecart)}</div>
     <div class="meta"><a href="${N.url}" target="_blank" rel="noopener">Site officiel : ${N.org} ↗</a></div></section>`};
  return`<p class="note">Le texte des normes est protégé par le droit d'auteur. VigiLex suit leur statut, leurs révisions et leurs amendements, résume les changements et renvoie vers l'éditeur officiel pour l'achat.</p>
  ${sel.length?sel.map(carte).join(""):'<div class="card empty">Aucune norme dans votre périmètre. Ajoutez-en dans « Périmètre ».</div>'}
  ${autres.length?`<div class="card"><h2>Autres normes disponibles dans la base</h2><div class="list" style="margin-top:6px">${autres.map(k=>`<div class="li"><span class="tag">${DOM[NORMES[k].dom]}</span><span><b>${NORMES[k].ref}</b><br><span class="muted">${NORMES[k].titre}</span></span><span class="pill ${NORMES[k].pill}">${NORMES[k].statut}</span></div>`).join("")}</div></div>`:""}`;
};

/* ============ VEILLE SCIENTIFIQUE ET GUIDES ============ */
function biblioDe(cat){return BIBLIO.filter(b=>b.cat===cat&&b.prod.some(x=>S.profil.produits.includes(x)))}
const nomDanger=id=>{for(const k in DANGERS){const d=DANGERS[k].find(x=>x.id===id);if(d)return d.nom}return id};
VIEWS.science=()=>{const bloc=(titre,cat,vide)=>{const l=biblioDe(cat);
    return`<div class="card"><h2>${titre}</h2>${l.length?`<div class="list" style="margin-top:6px">${l.map(b=>`<div class="li"><span><span class="tag">${b.type}</span></span>
      <span><span class="mono muted">${b.org} · ${b.an}</span><br><a href="${b.url}" target="_blank" rel="noopener">${esc(b.titre)} ↗</a>
      <div class="chips" style="margin-top:5px">${b.dangers.map(d=>`<span class="pill p-info">${esc(nomDanger(d))}</span>`).join("")}</div></span><span></span></div>`).join("")}</div>`:`<div class="empty">${vide}</div>`}</div>`};
  return`<p class="note">Publications et guides rattachés à vos produits : ${S.profil.produits.map(k=>PRODUITS[k].nom).join(", ")||"aucun produit sélectionné"}. Chaque document est relié aux dangers qu'il documente dans la base HACCP.</p>
  ${bloc("Avis scientifiques, rapports et alertes","sci","Aucune publication pour vos produits.")}
  ${bloc("Guides d'application, codes d'usages et normes produit","guide","Aucun guide pour vos produits.")}`;
};

/* ============ BASE HACCP ============ */
VIEWS.haccp=()=>{const pr=S.profil.produits;
  if(!pr.length)return`<div class="card empty">Aucun produit dans votre périmètre. Ajoutez-en dans « Périmètre ».</div>`;
  return`<p class="note">Bibliothèque des dangers par produit, chacun relié à ses sources réglementaires, scientifiques et à ses guides. Elle sert de base documentée à l'analyse des dangers (principe 1 de l'HACCP). Le classement CCP / PRPo / PRP est indicatif : il se décide dans l'étude HACCP du site.</p>
  ${pr.map(k=>{const D=DANGERS[k];
   if(!D)return`<div class="card"><h2>${PRODUITS[k].nom}</h2><div class="empty">Fiche à préparer par l'expert.</div></div>`;
   const src=(d,cat)=>BIBLIO.filter(b=>b.cat===cat&&b.dangers.includes(d.id));
   return`<div class="card" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><span class="label">Produit</span><h2>${PRODUITS[k].nom}</h2></div>
     <span><b>${D.length}</b> dangers documentés${S.haccpRevoir.length?` · <b style="color:var(--orange)">${D.filter(d=>S.haccpRevoir.includes(d.id)).length} à revoir</b>`:""}</span></div>
   <div class="tbl"><table><thead><tr><th>Danger</th><th>Type</th><th>Étape</th><th style="min-width:240px">Limite / référence</th><th>Sources</th><th>Maîtrise</th></tr></thead><tbody>
   ${D.map(d=>`<tr><td><b>${esc(d.nom)}</b>${S.haccpRevoir.includes(d.id)?'<br><span class="pill p-warn">À revoir : nouvel avis</span>':""}</td>
    <td><span class="tag">${d.type}</span></td><td>${esc(d.etape)}</td><td>${esc(d.limite)}</td>
    <td><div class="chips">${d.reg.map(r=>`<span class="pill p-info" title="Réglementaire">${esc(r)}</span>`).join("")}${src(d,"sci").map(b=>`<span class="pill p-warn" title="${esc(b.titre)}">${b.org} ${b.an}</span>`).join("")}${src(d,"guide").map(b=>`<span class="pill p-ok" title="${esc(b.titre)}">${b.org==="Codex"?b.an:b.org+" "+b.an}</span>`).join("")}</div></td>
    <td>${esc(d.maitrise)}<br><span class="tag">${d.niveau}</span></td></tr>`).join("")}
   </tbody></table></div>
   <div class="meta"><span><span class="pill p-info">Réglementaire</span></span><span><span class="pill p-warn">Scientifique</span></span><span><span class="pill p-ok">Guide / Codex</span></span></div>`}).join("")}`;
};
