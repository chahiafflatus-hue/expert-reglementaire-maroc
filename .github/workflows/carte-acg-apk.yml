name: Carte ACG – APK Android

on:
  push:
    paths:
      - 'carte_acg/**'
      - '.github/workflows/carte-acg-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carte_acg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      # Bibliothèque SQLite utilisée par les tests de la base de données.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: carte-acg-apk
          path: carte_acg/build/app/outputs/flutter-apk/app-release.apk
